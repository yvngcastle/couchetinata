const DATA={"slides": [{"title": "Египетската мозайка", "lead": "Цвят, символи и майсторство в малки детайли.", "items": ["Проучване в 7 слайда", "От стъклените инкрустации до мозайките на Александрия"], "notes": "Темата обхваща две свързани, но различни традиции: египетските декоративни инкрустации и мозаечно стъкло, както и подовите мозайки от елинистическия и римския Египет. Не всички произведения с египетски мотиви са изработени или открити в Египет. В презентацията посочваме техниката и произхода на конкретните примери. Декоративният орнамент върху заглавния слайд е съвременна стилизация, а не изображение на археологически предмет. Проверка на музейните източници: 14 октомври 2026 г.", "refs": ["shrine", "dog"], "kind": "cover", "label": "ИЗКУСТВО / ЕГИПЕТ"}, {"title": "Какво означава „мозайка“?", "lead": "Терминът обхваща различни начини за създаване на изображение.", "items": [["Подова мозайка", "Малки каменни частици, наречени тесери, образуват картина върху основа."], ["Инкрустация", "Декоративни елементи се вграждат или закрепват в повърхността на предмет."], ["Мозаечно стъкло", "Цветни стъклени пръчки създават рисунък, видим в напречния срез."]], "notes": "При традиционната подова мозайка изображението възниква от подреждането на отделни частици. При мозаечното стъкло многоцветният рисунък се оформя вътре в стъкления сноп, преди той да се нареже. Получената плочка може да служи като инкрустация. Затова „мозайка“ и „инкрустация“ не са напълно взаимозаменяеми понятия. Египетската традиция включва и едноцветни инкрустации. Точната техника трябва да се определя според самия предмет и музейното му описание.", "refs": ["sema", "shrine", "dog"], "kind": "rows", "label": "01 / ПОНЯТИЯ"}, {"title": "Традиция през различни епохи", "lead": "Фараонската украса и александрийската мозайка имат различен контекст.", "items": [["Ново царство", "Стъклени инкрустации украсяват предмети и архитектурни елементи."], ["Късна епоха", "Дървени светилища получават богата украса от стъклени елементи."], ["Елинистически Египет", "В Александрия се развиват детайлни подови мозайки с фигурални сцени."]], "notes": "Музеят „Метрополитън“ пази стъклена инкрустация от двореца в Малката край Тива, датирана в Новото царство. Друг музейен запис свидетелства за дървени светилища с плътна стъклена украса от края на VI век пр.н.е. нататък. Птолемеевият Египет съчетава местни и гръцки художествени традиции. Мозайката със седящо куче от Александрия е датирана във II век пр.н.е. Тези примери показват различни употреби на малки цветни елементи, без да доказват единна непроменена техника през всички епохи.", "refs": ["early", "shrine", "dog"], "kind": "rows", "label": "02 / ИСТОРИЧЕСКО РАЗВИТИЕ"}, {"title": "Материали и техника", "lead": "Двата метода изискват прецизност, но изграждат образа по различен начин.", "items": [["Каменна мозайка", "Мраморни и варовикови тесери се подреждат по контурите на изображението."], ["Стъклена композиция", "Цветни пръчки се събират в сноп, който се изтегля в дълъг прът."], ["Финишна обработка", "Прътът се нарязва напречно. Лицето на плочките се заглажда и полира."]], "notes": "За мозайката със седящо куче музеят в Александрия посочва opus vermiculatum: техника с много малки тесери, следващи формите на изображението. Частиците са с размери приблизително 1–4 мм. Те позволяват плавни цветови преходи и точни очертания. The Met описва мозаечното стъкло като сноп от цветни пръчки, изтеглен и нарязан напречно. Така могат да се получат множество плочки със сходен рисунък. Методът наподобява повторение на изображение, а не нареждане на всяка отделна фигура от камъчета.", "refs": ["dog", "sema"], "kind": "rows", "label": "03 / МАТЕРИАЛИ И ИЗРАБОТКА"}, {"title": "Мотивите носят смисъл", "lead": "Украсата може да предава религиозни идеи или да показва сцени от живота.", "items": [["„Сема тауи“", "Символ на обединението на Горен и Долен Египет."], ["Розети и орнаменти", "Повтарящи се цветни мотиви оформят декоративни рамки."], ["Животни и пейзажи", "Фигуралните мозайки представят животни, хора и нилски сцени."]], "notes": "Инкрустацията със „сема тауи“ показва растенията на двете части на Египет, свързани с йероглифа за обединение. Тя е малка стъклена плочка от периода приблизително 100 г. пр.н.е. – 100 г. сл.н.е. British Museum описва мозаечен стъклен бордюр с бели розети и жълти центрове върху тъмносин фон. Декоративният мотив не винаги има едно установено символно значение. При фигуралните мозайки цветовете служат и за светлосенки, пространствено внушение и разграничаване на детайлите.", "refs": ["sema", "rosette", "nile"], "kind": "rows", "label": "04 / ОБРАЗИ И СИМВОЛИ"}, {"title": "Три показателни примера", "lead": "Произходът и предназначението са толкова важни, колкото изображението.", "items": [["Стъклена плочка", "„Сема тауи“, Египет, около 100 г. пр.н.е. – 100 г. сл.н.е. Религиозен и държавен символ."], ["Седящо куче", "Александрия, II век пр.н.е. Подова мозайка с куче до преобърнат съд."], ["Изглед към Нил", "Римска мозайка от Палестрина, Италия. Египетски пейзаж, представен извън Египет."]], "notes": "Мозайката със седящо куче е открита на мястото на Bibliotheca Alexandrina. Реалистичните детайли и светлосенките показват умението на майстора. Предположението за връзка с литературна или театрална сцена остава интерпретация. Getty представя фрагмент с изглед към Нил, намерен в древна Пренесте, днешна Палестрина в Италия, и датиран в широкия диапазон 100 г. пр.н.е. – 100 г. сл.н.е. Той показва интереса на римската публика към Египет. Египетски сюжет не означава автоматично египетски произход.", "refs": ["sema", "dog", "nile"], "kind": "rows", "label": "05 / ЗАПАЗЕНИ ПРОИЗВЕДЕНИЯ"}, {"title": "Изводи и източници", "lead": "Египетската мозайка свързва местна символика, техническо умение и културен обмен.", "items": [], "notes": "Основният извод е, че темата включва различни художествени практики. Мозаечното стъкло съхранява сложен рисунък в миниатюрен размер. Подовите мозайки на Александрия използват каменни частици, за да създават реалистични фигури. Нилските сцени извън Египет показват разпространението на египетски образи в Средиземноморието. При изучаване на произведение трябва да се проверяват датировката, материалът, техниката и мястото на откриване. Източниците по-долу са музейни каталози и кураторски описания, проверени на 14 октомври 2026 г.", "refs": ["early", "shrine", "sema", "rosette", "dog", "nile"], "kind": "sources", "label": "06 / ОБОБЩЕНИЕ И БИБЛИОГРАФИЯ"}], "sources": {"early": ["The Met · Стъклена инкрустация от Малката", "https://www.metmuseum.org/art/collection/search/551709"], "shrine": ["The Met · Инкрустации и части от светилища", "https://www.metmuseum.org/art/collection/search/544863"], "sema": ["The Met · Инкрустация със „сема тауи“", "https://www.metmuseum.org/art/collection/search/570445"], "rosette": ["British Museum · Мозаечно стъкло с розети", "https://www.britishmuseum.org/collection/object/Y_EA17193"], "dog": ["Bibliotheca Alexandrina · Мозайка със седящо куче", "https://antiquities.bibalex.org/Collection/Detail.aspx?a=859&lang=en"], "nile": ["Getty · Мозайка с изглед към Нил", "https://www.getty.edu/art/mobile/center/egypt/stop.php?id=364890"]}};const {slides,sources}=DATA;

function content(s){if(s.kind==='cover')return `${skyline}<div class="cover-bottom">${s.items.join('<br>')}<br><br>14 октомври 2026</div>`;if(s.kind==='stats')return `<div class="stats">${s.items.map(x=>`<div class="stat"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div>`;if(s.kind==='countries')return `<div class="countries">${s.items.map((x,i)=>`<div class="country"><span class="no">0${i+1}</span><h3>${x[0]}</h3><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join('')}</div>`;if(s.kind==='bars')return `<div class="chart" role="img" aria-label="Услуги: приблизително 80 процента. Други сектори: приблизително 20 процента. 2024 година.">${s.items.map(x=>`<div class="bar-label"><span>${x[1]}</span><span>≈ ${x[0]}%</span></div><div class="bar-track"><div class="bar" style="width:${x[0]}%"></div></div>`).join('')}<p class="chart-caption">Дял от икономическото производство, 2024 г. Закръглени стойности.</p></div>`;if(s.kind==='sources')return `<div class="bibliography">${refHtml(s.refs)}</div>`;return `<div class="rows ${s.kind==='timeline'?'timeline':''}">${s.items.map(x=>`<div class="row"><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}</div>`}
stage.innerHTML=slides.map((s,i)=>`<section class="slide ${s.kind==='cover'?'cover':''}" aria-label="Слайд ${i+1}: ${s.title}" data-index="${i}"><div class="eyebrow">${s.label}</div><${i?'h2':'h1'} class="${i?'':'hero-title'}">${s.title}</${i?'h2':'h1'}><p class="lead">${s.lead}</p>${content(s)}${s.kind==='cover'||s.kind==='sources'?'':`<div class="sources-line">${refHtml(s.refs)}</div>`}</section>`).join('');
const els=[...document.querySelectorAll('.slide')],notes=document.getElementById('notes'),notesButton=document.getElementById('notes-open'),contents=document.getElementById('contents');let index=0;
function go(n){index=Math.max(0,Math.min(slides.length-1,n));els.forEach((el,i)=>{el.classList.toggle('active',i===index);el.setAttribute('aria-hidden',i!==index)});document.getElementById('count').textContent=`${String(index+1).padStart(2,'0')} / ${slides.length}`;document.getElementById('progress').style.width=`${(index+1)/slides.length*100}%`;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;document.getElementById('notes-title').textContent=slides[index].title;document.getElementById('notes-body').textContent=slides[index].notes;document.getElementById('notes-refs').innerHTML=refHtml(slides[index].refs);history.replaceState(null,'',`#slide-${index+1}`);window.scrollTo({top:0,behavior:'instant'})}
function setNotes(open){notes.classList.toggle('open',open);notes.inert=!open;document.getElementById('scrim').classList.toggle('open',open);notesButton.setAttribute('aria-expanded',open);if(open)document.getElementById('notes-close').focus();else notesButton.focus()}
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){document.getElementById('fullscreen').textContent='Не е наличен'}}
document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);notesButton.onclick=()=>setNotes(!notes.classList.contains('open'));document.getElementById('notes-close').onclick=()=>setNotes(false);document.getElementById('scrim').onclick=()=>setNotes(false);document.getElementById('fullscreen').onclick=full;document.getElementById('print').onclick=()=>window.print();document.getElementById('toc-open').onclick=()=>contents.showModal();document.getElementById('toc-close').onclick=()=>contents.close();document.getElementById('toc').innerHTML=slides.map((s,i)=>`<button data-to="${i}"><span>${String(i+1).padStart(2,'0')}</span>${s.title}</button>`).join('');document.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>{go(+b.dataset.to);contents.close()});
document.addEventListener('keydown',e=>{if(contents.open)return;if(e.key==='Escape'&&notes.classList.contains('open')){setNotes(false);return}if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key.toLowerCase()==='n'){e.preventDefault();setNotes(!notes.classList.contains('open'));return}if(notes.classList.contains('open'))return;if(e.key.toLowerCase()==='f'){full();return}if(['ArrowRight','PageDown','ArrowLeft','PageUp','Home','End'].includes(e.key)||e.key===' '&&e.target===document.body){e.preventDefault();if(['ArrowRight','PageDown',' '].includes(e.key))go(index+1);else if(['ArrowLeft','PageUp'].includes(e.key))go(index-1);else go(e.key==='Home'?0:slides.length-1)}});
let touchX=0,touchY=0;stage.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.5&&!notes.classList.contains('open')&&!contents.open)go(index+(dx<0?1:-1))},{passive:true});go((+location.hash.replace('#slide-','')||1)-1);
